# Week 7 closed-loop evaluation on held-out seeds (3000+, never used to fit or tune a monitor).
# <behaviour>_oracle: Week 6 fleet (knows the saboteur); _blind: no monitor; _threshold / _logistic: blind until flagged.
# Needs data/models/{threshold,logistic}.joblib from scripts/train_monitor.py.
name: week7_eval
env:
  n_agents: 4
  max_steps: 500
  sensor_range: 1
layouts: [tiny, tiny_choke]
# No delivery for L consecutive steps counts as a deadlock. Chosen after seeing Week 6 data: the 95th percentile
# (rounded) of the longest no-delivery gap per episode in no_saboteur, per layout (30 episodes each).
deadlock_L: {tiny: 26, tiny_choke: 30}

# condition name -> fleet kind, or {kind, oracle, monitor}
conditions:
  no_saboteur: honest
  no_saboteur_threshold: {kind: honest, monitor: data/models/threshold.joblib}
  no_saboteur_logistic: {kind: honest, monitor: data/models/logistic.joblib}
  idle_robot_blind: {kind: parked, oracle: false}
  idle_robot_threshold: {kind: parked, oracle: false, monitor: data/models/threshold.joblib}
  idle_robot_logistic: {kind: parked, oracle: false, monitor: data/models/logistic.joblib}
  goal_blocker_oracle: {kind: goal_blocker}
  goal_blocker_blind: {kind: goal_blocker, oracle: false}
  goal_blocker_threshold: {kind: goal_blocker, oracle: false, monitor: data/models/threshold.joblib}
  goal_blocker_logistic: {kind: goal_blocker, oracle: false, monitor: data/models/logistic.joblib}
  corridor_parker_oracle: {kind: corridor_parker}
  corridor_parker_blind: {kind: corridor_parker, oracle: false}
  corridor_parker_threshold: {kind: corridor_parker, oracle: false, monitor: data/models/threshold.joblib}
  corridor_parker_logistic: {kind: corridor_parker, oracle: false, monitor: data/models/logistic.joblib}
  shelf_hider_oracle: {kind: shelf_hider}
  shelf_hider_blind: {kind: shelf_hider, oracle: false}
  shelf_hider_threshold: {kind: shelf_hider, oracle: false, monitor: data/models/threshold.joblib}
  shelf_hider_logistic: {kind: shelf_hider, oracle: false, monitor: data/models/logistic.joblib}
  shelf_squatter_oracle: {kind: shelf_squatter}
  shelf_squatter_blind: {kind: shelf_squatter, oracle: false}
  shelf_squatter_threshold: {kind: shelf_squatter, oracle: false, monitor: data/models/threshold.joblib}
  shelf_squatter_logistic: {kind: shelf_squatter, oracle: false, monitor: data/models/logistic.joblib}

planner:
  horizon: 32        # space-time A* horizon, then spatial A*
  replan_every: 8    # K
  stuck_limit: 6     # steps without moving before a randomised yield is considered
  yield_prob: 0.5
  quarantine_steps: null  # Week 7 design: the flagged tile stays blocked for the episode (no longer the default)

saboteur:
  common:
    camouflage: 0.2  # per-step probability of an honest-looking cover action
  goal_blocker: {block_distance: 5}
  corridor_parker: {park_steps: 15, lookahead: 12}
  shelf_hider: {cooldown: 20}

seeds: [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010, 3011, 3012, 3013, 3014, 3015, 3016, 3017, 3018, 3019, 3020, 3021, 3022, 3023, 3024, 3025, 3026, 3027, 3028, 3029]

smoke:
  episodes: 2
  max_steps: 100
