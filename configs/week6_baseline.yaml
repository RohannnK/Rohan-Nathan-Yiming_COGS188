# Week 6 baseline: scripted saboteur vs. A* fleet, no monitor.
name: week6_baseline
env:
  n_agents: 4
  max_steps: 500
  sensor_range: 1
layouts: [tiny, tiny_choke]
# No delivery for L consecutive steps counts as a deadlock. Chosen after seeing Week 6 data: the 95th percentile
# (rounded) of the longest no-delivery gap per episode in no_saboteur, per layout (30 episodes each).
deadlock_L: {tiny: 26, tiny_choke: 30}

# condition name -> fleet kind (random | honest | parked | saboteur behaviour)
conditions:
  random_policy: random
  no_saboteur: honest
  idle_robot: parked
  goal_blocker: goal_blocker
  corridor_parker: corridor_parker
  shelf_hider: shelf_hider
  shelf_squatter: shelf_squatter

planner:
  horizon: 32        # space-time A* horizon, then spatial A*
  replan_every: 8    # K
  stuck_limit: 6     # steps without moving before a randomised yield is considered
  yield_prob: 0.5

saboteur:
  common:
    camouflage: 0.2  # per-step probability of an honest-looking cover action
  goal_blocker: {block_distance: 5}
  corridor_parker: {park_steps: 15, lookahead: 12}
  shelf_hider: {cooldown: 20}

# Explicit seeds, shared by every condition (paired design).
seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
        1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
        1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]

smoke:
  episodes: 2
  max_steps: 100
